<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Healthcare Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- -------- Header -------- -->
  <header class="header-login">Healthcare Chatbot</header>

  <!-- -------- Sign Up Form Wrapper -------- -->
  <div class="form-wrapper">
    <div class="form-container">
      <h2>Sign Up</h2>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, msg in messages %}
              <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <!-- Sign Up Form -->
      <form action="{{ url_for('signup') }}" method="POST">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter a password" required>

        <button type="submit" class="btn-signup">Sign Up</button>
      </form>

      <p class="signup-text">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
      </p>

      <p class="demo-text">
        Want to try a demo account? 
        <button type="button" onclick="fillDemoUser()" class="btn-demo">Sign Up as Demo User</button>
      </p>
    </div>
  </div>

  <!-- Optional JS for demo autofill -->
  <script>
    function fillDemoUser() {
      document.getElementById('email').value = 'demo@example.com';
      document.getElementById('password').value = 'demopassword';
    }
  </script>
</body>
</html>
